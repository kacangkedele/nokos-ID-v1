<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#071b40" />
<title>Admin Dashboard — Nokos.ID</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/assets/nokos-logo.png" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<nav class="navbar">
  <div class="container">
    <a href="/admin/index.html" class="brand">
      <img src="/assets/nokos-logo.png" alt="Nokos.ID" />
      <div>Nokos.ID<small>Admin Panel</small></div>
    </a>
    <button class="hamburger" onclick="toggleNav()" aria-label="Menu">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="/admin/index.html">Dashboard</a>
      <a href="/admin/verifikasi.html">Verifikasi Deposit</a>
      <a href="/admin/providers.html">Multi-Provider</a>
      <a href="/admin/audit.html">Audit Log</a>
      <a href="/admin/2fa-setup.html">2FA</a>
      <a href="#" onclick="logout();return false;">Logout</a>
    </div>
  </div>
</nav>

<section class="section">
  <div class="container">
    <h1 style="font-size:24px;margin-bottom:20px">Admin Dashboard</h1>
    <div class="grid grid-4" id="stats"><div class="state"><div class="spinner"></div></div></div>

    <div class="grid grid-2" style="margin-top:20px">
      <a href="/admin/verifikasi.html" class="card" style="text-decoration:none;color:inherit">
        <div class="card-title">Deposit Pending</div>
        <div class="card-value" id="pendingCount">-</div>
        <div class="muted" style="margin-top:8px;font-size:13px">Klik untuk verifikasi →</div>
      </a>
      <div class="card">
        <div class="card-title">Aksi Cepat</div>
        <div style="margin-top:8px;display:flex;flex-direction:column;gap:8px">
          <a href="/admin/verifikasi.html" class="btn btn-accent btn-block">Verifikasi Deposit</a>
          <a href="/admin/providers.html" class="btn btn-outline btn-block">Multi-Provider Management</a>
          <a href="/admin/audit.html" class="btn btn-outline btn-block">Lihat Audit Log</a>
          <a href="/admin/2fa-setup.html" class="btn btn-outline btn-block">Pengaturan 2FA</a>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="footer"><div class="container"><strong>Nokos.ID</strong> Admin Panel</div></footer>

<script src="/app.js"></script>
<script>
  async function load() {
    const me = await requireAdmin();
    if (!me) return;
    try {
      const res = await API.admin.stats();
      const s = res.stats;
      document.getElementById("stats").innerHTML = `
        <div class="card"><div class="card-title">Total User</div><div class="card-value">${s.total_users}</div><div class="muted" style="font-size:12px">${s.active_users} aktif</div></div>
        <div class="card"><div class="card-title">Deposit Disetujui</div><div class="card-value">${s.deposits_approved}</div><div class="muted" style="font-size:12px">${fmtIDR(s.total_deposit_amount)}</div></div>
        <div class="card"><div class="card-title">Order Selesai</div><div class="card-value">${s.orders_completed}</div><div class="muted" style="font-size:12px">${fmtIDR(s.total_order_amount)}</div></div>
        <div class="card"><div class="card-title">Error Provider 24j</div><div class="card-value">${s.provider_errors_24h}</div></div>
      `;
      document.getElementById("pendingCount").textContent = s.deposits_pending;
    } catch (e) {
      document.getElementById("stats").innerHTML = `<div class="state">Gagal memuat statistik: ${escapeHtml(e.message)}</div>`;
    }
  }
  load();
</script>
</body>
</html>
